# Optimized MySQL config file for Bagisto Performance Testing (100+ Concurrent Users).
# Location: Ensure this file replaces your current configuration file.

# The following options will be passed to all MySQL clients
[client]
port=3306
socket="C:/diplomalatest/mysql/mysql.sock"

# The MySQL server
default-character-set=utf8mb4

[mysqld]
# REMOVED innodb_force_recovery=3 to allow database POST/WRITE operations normally.

port=3306
socket="C:/diplomalatest/mysql/mysql.sock"
basedir="C:/diplomalatest/mysql"
tmpdir="C:/diplomalatest/tmp"
datadir="C:/diplomalatest/mysql/data"
pid_file="mysql.pid"

# Performance Tuning for Load Testing
max_connections=500
max_allowed_packet=64M
key_buffer_size=64M
sort_buffer_size=4M
read_buffer_size=2M
read_rnd_buffer_size=4M
myisam_sort_buffer_size=32M
net_buffer_length=16K
log_error="mysql_error.log"

# Where do all the plugins live
plugin_dir="C:/diplomalatest/mysql/lib/plugin/"

# Replication Master Server (default)
server-id=1

# InnoDB Storage Engine Optimization Settings
innodb_data_home_dir="C:/diplomalatest/mysql/data"
innodb_data_file_path=ibdata1:10M:autoextend
innodb_log_group_home_dir="C:/diplomalatest/mysql/data"

# Increased buffer values to support concurrent database operations
innodb_buffer_pool_size=256M
innodb_log_file_size=64M
innodb_log_buffer_size=16M
innodb_flush_log_at_trx_commit=2
innodb_lock_wait_timeout=100

## UTF 8 Settings
sql_mode=NO_ZERO_IN_DATE,NO_ZERO_DATE,NO_ENGINE_SUBSTITUTION
log_bin_trust_function_creators=1
character-set-server=utf8mb4
collation-server=utf8mb4_general_ci

[mysqldump]
max_allowed_packet=64M

[mysql]
default-character-set=utf8mb4

[isamchk]
key_buffer=64M
sort_buffer_size=64M
read_buffer=16M
write_buffer=16M

[myisamchk]
key_buffer=64M
sort_buffer_size=64M
read_buffer=16M
write_buffer=16M

[mysqlhotcopy]
